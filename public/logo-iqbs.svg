<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 680" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="goldGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e298" />
      <stop offset="35%" stop-color="#dfbc64" />
      <stop offset="70%" stop-color="#caa34f" />
      <stop offset="100%" stop-color="#b48834" />
    </linearGradient>
    
    <!-- Emerald Green Gradient -->
    <linearGradient id="emeraldGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e774f" />
      <stop offset="50%" stop-color="#095c3c" />
      <stop offset="100%" stop-color="#05442b" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadowFull" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- STAR EMBLEM (CENTER AT 250, 240) -->
  <g transform="translate(250, 240)">
    <!-- 8-POINTED ISLAMIC STAR (RUB EL HIZB) -->
    <path d="
      M 0,-215
      L 54,-131 L 152,-152 L 131,-54 L 215,0
      L 131,54 L 152,152 L 54,131 L 0,215
      L -54,131 L -152,152 L -131,54 L -215,0
      L -131,-54 L -152,-152 L -54,-131 Z
    " fill="url(#goldGradFull)" filter="url(#shadowFull)" />

    <!-- Emerald Inner Star -->
    <path d="
      M 0,-198
      L 50,-121 L 140,-140 L 121,-50 L 198,0
      L 121,50 L 140,140 L 50,121 L 0,198
      L -50,121 L -140,140 L -121,50 L -198,0
      L -121,-50 L -140,-140 L -50,-121 Z
    " fill="url(#emeraldGradFull)" />

    <!-- Thin Gold Inner Trim Line -->
    <path d="
      M 0,-185
      L 46,-112 L 130,-130 L 112,-46 L 185,0
      L 112,46 L 130,130 L 46,112 L 0,185
      L -46,112 L -130,130 L -112,46 L -185,0
      L -112,-46 L -130,-130 L -46,-112 Z
    " fill="none" stroke="url(#goldGradFull)" stroke-width="2.5" opacity="0.85" />

    <!-- TOP CALLIGRAPHIC CRESCENT ARC -->
    <path d="M -110,-65 C -55,-145 55,-145 110,-65 C 90,-108 -90,-108 -110,-65 Z" fill="url(#goldGradFull)" opacity="0.9" />
    <circle cx="-85" cy="-70" r="3" fill="url(#goldGradFull)" />
    <circle cx="-60" cy="-98" r="3.5" fill="url(#goldGradFull)" />
    <circle cx="-30" cy="-118" r="3.5" fill="url(#goldGradFull)" />
    <circle cx="0" cy="-124" r="4" fill="url(#goldGradFull)" />
    <circle cx="30" cy="-118" r="3.5" fill="url(#goldGradFull)" />
    <circle cx="60" cy="-98" r="3.5" fill="url(#goldGradFull)" />
    <circle cx="85" cy="-70" r="3" fill="url(#goldGradFull)" />
    <path d="M -70,-86 Q -45,-108 -18,-110 Q 0,-114 18,-110 Q 45,-108 70,-86 Q 35,-101 0,-103 Q -35,-101 -70,-86 Z" fill="url(#goldGradFull)" />

    <!-- CENTER EMBLEM: PALM TREE -->
    <path d="M 26,14 L 32,14 L 34,-60 L 24,-60 Z" fill="url(#goldGradFull)" />
    <line x1="24" y1="-46" x2="34" y2="-43" stroke="#9e7b28" stroke-width="1.5" />
    <line x1="25" y1="-32" x2="33" y2="-29" stroke="#9e7b28" stroke-width="1.5" />
    <line x1="26" y1="-18" x2="33" y2="-15" stroke="#9e7b28" stroke-width="1.5" />

    <!-- Palm Fronds / Leaves -->
    <path d="M 29,-60 C 19,-88 -9,-88 -23,-78 C -14,-74 5,-70 26,-60 Z" fill="url(#goldGradFull)" />
    <path d="M 29,-60 C 10,-93 23,-112 14,-116 C 9,-98 19,-79 29,-60 Z" fill="url(#goldGradFull)" />
    <path d="M 29,-60 C 29,-98 42,-116 47,-112 C 42,-93 36,-79 29,-60 Z" fill="url(#goldGradFull)" />
    <path d="M 29,-60 C 47,-93 75,-88 79,-78 C 65,-74 47,-70 29,-60 Z" fill="url(#goldGradFull)" />
    <path d="M 29,-60 C 51,-79 79,-60 85,-46 C 70,-51 49,-56 29,-60 Z" fill="url(#goldGradFull)" />
    <path d="M 29,-60 C 14,-74 -14,-60 -20,-46 C -5,-51 11,-56 29,-60 Z" fill="url(#goldGradFull)" />

    <!-- THE HOLY KA'BAH -->
    <polygon points="-70,9 -14,9 -14,-42 -70,-42" fill="url(#goldGradFull)" />
    <polygon points="-14,9 0,2 0,-47 -14,-42" fill="#caa34f" />
    <line x1="-70" y1="-30" x2="-14" y2="-30" stroke="#684a14" stroke-width="2.5" />
    <line x1="-14" y1="-30" x2="0" y2="-35" stroke="#52390d" stroke-width="2.5" />
    <rect x="-39" y="-19" width="11" height="28" rx="1.5" fill="#684a14" />
    <rect x="-37" y="-17" width="7" height="24" rx="1" fill="#dfbc64" />

    <!-- OPEN QURAN ON REHAL -->
    <path d="
      M 0,3
      C -28,-8 -70,-8 -107,9
      C -79,26 -37,23 0,15
      C 37,23 79,26 107,9
      C 70,-8 28,-8 0,3 Z
    " fill="url(#goldGradFull)" />
    <line x1="0" y1="3" x2="0" y2="15" stroke="#9e7b28" stroke-width="3" />
    <path d="M -88,10 C -60,-2 -28,0 -7,8" fill="none" stroke="#7a5813" stroke-width="1.5" opacity="0.6" />
    <path d="M 88,10 C 60,-2 28,0 7,8" fill="none" stroke="#7a5813" stroke-width="1.5" opacity="0.6" />

    <path d="M -70,18 L 65,63 L 46,70 L -88,25 Z" fill="url(#goldGradFull)" />
    <path d="M 70,18 L -65,63 L -46,70 L 88,25 Z" fill="#b9903b" />
  </g>

  <!-- "IQBS" CALLIGRAPHIC TYPOGRAPHY -->
  <g transform="translate(0, 520)" fill="#095c3c">
    <!-- Letter 'I' with calligraphy serif -->
    <path d="
      M 60,65
      C 45,68 35,76 35,84
      L 50,83
      L 48,-18
      C 42,-12 36,-6 32,-3
      L 28,-14
      C 48,-32 62,-52 68,-65
      L 77,-62
      L 63,65 Z
    " />

    <!-- Letter 'Q' with sweeping Arabic-style curved tail -->
    <path d="
      M 160,-65
      C 205,-65 220,-25 220,10
      C 220,38 208,65 185,78
      C 198,95 210,105 230,108
      L 225,116
      C 192,118 165,95 150,78
      C 120,75 105,48 105,10
      C 105,-28 125,-65 160,-65 Z
      M 165,-48
      C 138,-48 128,-15 128,12
      C 128,42 140,65 165,65
      C 192,65 200,38 200,10
      C 200,-22 188,-48 165,-48 Z
    " />

    <!-- Letter 'B' with stylized Islamic curves -->
    <path d="
      M 245,-60
      L 262,-58
      L 255,-22
      C 268,-38 285,-58 310,-58
      C 335,-58 348,-40 348,-18
      C 348,-2 338,12 320,18
      C 345,25 358,45 358,68
      C 358,95 335,112 298,112
      C 265,112 238,102 225,92
      L 230,80
      C 245,90 268,98 292,98
      C 320,98 335,85 335,68
      C 335,48 318,32 290,32
      L 272,32
      L 278,-10
      L 290,-10
      C 312,-10 325,-20 325,-35
      C 325,-48 315,-52 302,-52
      C 285,-52 268,-38 258,-20
      L 245,-20 Z
    " />

    <!-- Letter 'S' with fluid Arabic-style curves -->
    <path d="
      M 440,-62
      L 446,-50
      C 425,-58 402,-62 385,-62
      C 362,-62 348,-48 348,-32
      C 348,-15 362,-2 390,12
      C 425,30 445,48 445,75
      C 445,105 418,122 375,122
      C 350,122 322,112 305,98
      L 312,85
      C 332,98 355,108 375,108
      C 402,108 420,95 420,75
      C 420,55 405,42 375,28
      C 342,12 325,-5 325,-32
      C 325,-55 350,-75 390,-75
      C 410,-75 428,-70 440,-62 Z
    " />
  </g>
</svg>
